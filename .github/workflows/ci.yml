name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  node-and-go:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm install

      - name: Run fixture-backed Node tests
        run: npm test

      - name: Verify pipeline invariants
        run: npm run verify

      - name: Run repository health checks
        run: node test-all.mjs --quick

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: dashboard/go.mod

      - name: Run dashboard Go tests
        working-directory: dashboard
        run: go test ./...

      - name: Build dashboard
        working-directory: dashboard
        run: go build ./...
